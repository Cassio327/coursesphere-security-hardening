name: CI and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit and security regression tests
        run: pytest -q backend/tests
      - name: SAST with Bandit
        run: bandit -q -r backend -x backend/tests
      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit report
        continue-on-error: true
        run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build backend-1 frontend
      - name: Start replicated application
        run: docker compose up --detach backend-1 backend-2 frontend nginx
      - name: Demonstrate load balancing
        run: ./scripts/demo-load-balancing.sh
      - name: Run container security smoke test
        run: ./scripts/security-smoke-test.sh
      - name: Show application logs on failure
        if: failure()
        run: docker compose logs nginx backend-1 backend-2
      - name: Stop application
        if: always()
        run: docker compose down --volumes

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
