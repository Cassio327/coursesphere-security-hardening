worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format upstream_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

    access_log /dev/stdout upstream_json;
    error_log /dev/stderr warn;

    upstream coursesphere_backend {
        least_conn;
        server backend-1:8000 max_fails=3 fail_timeout=10s;
        server backend-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 16k;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /api/ {
            proxy_pass http://coursesphere_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
